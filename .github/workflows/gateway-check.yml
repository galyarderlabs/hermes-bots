# Hermes Mobile — Rust gateway compile gate.
#
# This is the compile gate for the gateway, because cargo is not
# installed on the dev machine: fmt, clippy (warnings denied), tests,
# and a release build must all pass here.
#
# The gateway lives in gateway/ (Rust Axum proxy per port-spec §9).
# If gateway/ or its Cargo.toml is absent, these steps fail honestly —
# there is no stub gateway to fall back on.
#
# Triggers: push to main, pull_request to main. No secrets required.

name: gateway-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for PRs only; main builds always run to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gateway-check:
    name: gateway-check (fmt, clippy, test, release build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings denied)
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release
